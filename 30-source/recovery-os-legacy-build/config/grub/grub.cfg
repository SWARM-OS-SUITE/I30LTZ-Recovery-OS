# ============================================================
#  I30LTZ Recovery OS — GRUB Boot Config
#  Version: %%VERSION%%  |  %%BUILD_DATE%%
# ============================================================

set default=0
set timeout=10
set timeout_style=menu

insmod all_video
insmod gfxterm
insmod gfxmenu
terminal_output gfxterm

# ── Color scheme (UGA Red + Carbon) ─────────────────────────
set menu_color_normal=light-gray/black
set menu_color_highlight=light-red/black

# ── Boot entries ─────────────────────────────────────────────

menuentry "▶  I30LTZ Recovery OS v%%VERSION%% (Live Session)" --class ubuntu --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper quiet splash \
            hostname=i30ltz-recovery username=dr-i30ltz \
            noeject noprompt \
            i30ltz_version=%%VERSION%%
    initrd  /casper/initrd
}

menuentry "   I30LTZ Recovery OS — Safe Mode (nomodeset)" --class ubuntu {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper nomodeset quiet \
            hostname=i30ltz-recovery username=dr-i30ltz \
            noeject noprompt
    initrd  /casper/initrd
}

menuentry "   I30LTZ Recovery OS — RAM Mode (toram)" --class ubuntu {
    set gfxpayload=keep
    linux   /casper/vmlinuz boot=casper toram quiet splash \
            hostname=i30ltz-recovery username=dr-i30ltz
    initrd  /casper/initrd
}

menuentry "   Check Disk for Defects" --class ubuntu {
    linux   /casper/vmlinuz boot=casper integrity-check quiet \
            hostname=i30ltz-recovery username=dr-i30ltz
    initrd  /casper/initrd
}

menuentry "   Install I30LTZ Recovery OS to Disk" --class ubuntu {
    linux   /casper/vmlinuz boot=casper only-ubiquity quiet splash \
            hostname=i30ltz-recovery username=dr-i30ltz
    initrd  /casper/initrd
}

menuentry "── Boot from Existing OS ──" {
    chainloader +1
}

menuentry "   UEFI Firmware Settings" {
    fwsetup
}
