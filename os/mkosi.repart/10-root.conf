# I30LTZ Recovery OS · root filesystem · 2026-10-01
# Discoverable GPT root type: systemd finds it automatically at boot.
# The installer grows it to fill the space you give it on the drive.
[Partition]
Type=root
Format=ext4
Label=i30ltz-root
CopyFiles=/
ExcludeFiles=/efi/
ExcludeFiles=/boot/
Minimize=guess
SizeMinBytes=6G
