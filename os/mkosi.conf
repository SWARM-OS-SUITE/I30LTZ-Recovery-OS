# =============================================================================
# I30LTZ Recovery OS — image recipe (mkosi v26)
# Version: see mkosi.version · Recipe date: 2026-10-01
# Ubuntu 24.04 LTS base · full-screen Dr. I30LTZ kiosk · external drive
# Build with ./build.sh (pins mkosi v26). Never hand-edit the built image.
# =============================================================================

[Distribution]
Distribution=ubuntu
Release=noble
Repositories=main,universe,restricted,multiverse

[Output]
ImageId=i30ltz-recovery-os
Format=disk
OutputDirectory=out
SplitArtifacts=partitions
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
# console=ttyS0 first so QEMU test boots log to serial; tty1 last = /dev/console
KernelCommandLine=rw quiet splash console=ttyS0,115200 console=tty1 loglevel=3 lsm=landlock,lockdown,yama,integrity,apparmor
Hostname=i30ltz-recovery
Locale=en_US.UTF-8
Keymap=us
Timezone=UTC
WithDocs=no
Packages=
        # ── base system ──────────────────────────────────────────────
        linux-image-generic
        linux-firmware
        intel-microcode
        amd64-microcode
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        systemd-zram-generator
        udev
        dbus
        libpam-systemd
        sudo
        apt
        ca-certificates
        locales
        tzdata
        bash-completion
        less
        nano
        # ── network (nmtui in the console) ───────────────────────────
        network-manager
        wpasupplicant
        iw
        wireless-regdb
        # ── kiosk: full-screen Dr. I30LTZ console ────────────────────
        cage
        foot
        dialog
        fonts-dejavu-core
        plymouth
        plymouth-label
        # ── graphics (Intel/AMD integrated) ──────────────────────────
        libgl1-mesa-dri
        mesa-vulkan-drivers
        mesa-va-drivers
        intel-media-va-driver-non-free
        # ── security ─────────────────────────────────────────────────
        ufw
        apparmor
        apparmor-profiles
        unattended-upgrades
        fwupd
        # ── Dr. I30LTZ "MAD IT" recovery toolkit ─────────────────────
        smartmontools
        nvme-cli
        hdparm
        gddrescue
        testdisk
        ntfs-3g
        exfatprogs
        dosfstools
        btrfs-progs
        xfsprogs
        e2fsprogs
        cryptsetup
        mdadm
        lvm2
        gdisk
        parted
        foremost
        sleuthkit
        clamav
        clamav-freshclam
        lshw
        dmidecode
        pciutils
        usbutils
        # ── SWARM_OS builder ─────────────────────────────────────────
        podman
        qemu-system-x86
        qemu-utils
        ovmf
        git

[Validation]
Checksum=yes

[Build]
# Build tools come from a sandboxed Ubuntu tree, so the build machine's own
# bootloader packages are never touched.
ToolsTree=default
ToolsTreeDistribution=ubuntu
ToolsTreeRelease=noble
CacheDirectory=mkosi.cache
