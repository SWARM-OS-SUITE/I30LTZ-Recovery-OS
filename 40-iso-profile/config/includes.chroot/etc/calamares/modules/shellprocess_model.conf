# Copy the AI model from the live session (persistent partition) to the new install
---
dontChroot: true
timeout: 1800
script:
  - command: "mkdir -p ${ROOT}/usr/share/ollama/.ollama && if [ -d /usr/share/ollama/.ollama/models ]; then rsync -a /usr/share/ollama/.ollama/models ${ROOT}/usr/share/ollama/.ollama/; fi; true"
    timeout: 1800
