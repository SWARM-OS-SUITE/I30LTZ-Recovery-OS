# Strip live-session autologin from the installed system
---
dontChroot: false
timeout: 300
script:
  - "sed -i '/^autologin-/d' /etc/lightdm/lightdm.conf"
  - "rm -f /etc/skel/.config/autostart/i30ltz-install.desktop"
  - "-apt-get purge -y live-boot live-boot-initramfs-tools live-config live-config-systemd calamares"
