---
defaultGroups: [ adm, sudo, plugdev, netdev, lpadmin ]
autologinGroup: autologin
doAutologin: false
sudoersGroup: sudo
setRootPassword: false
doReusePassword: true
availableShells: /bin/bash
avatarFilePath: ~/.face
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
passwordRequirements:
  minLength: 8
  maxLength: -1
allowWeakPasswords: false
