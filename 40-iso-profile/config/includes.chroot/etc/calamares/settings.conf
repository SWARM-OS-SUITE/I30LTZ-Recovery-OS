# I30LTZ Recovery OS - Calamares installer | v0.3.0-alpha | 2026-10-05
---
modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess_cleanup.conf
- id: initramfs
  module: shellprocess
  config: shellprocess_initramfs.conf
- id: model
  module: shellprocess
  config: shellprocess_model.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - removeuser
  - shellprocess@cleanup
  - shellprocess@initramfs
  - grubcfg
  - bootloader
  - shellprocess@model
  - umount
- show:
  - finished

branding: i30ltz
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
